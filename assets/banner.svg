<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#101726"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>

    <!-- Accent Text Gradient -->
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00c6ff"/>
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="pulse-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 52px;
      fill: url(#text-gradient);
      letter-spacing: 2px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
      letter-spacing: 1.5px;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
    
    /* Animations */
    @keyframes dash {
      to {
        stroke-dashoffset: -120;
      }
    }
    @keyframes pulse-node {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .trace-line {
      stroke: #38bdf8;
      stroke-width: 2.5;
      stroke-dasharray: 8 6;
      animation: dash 4s linear infinite;
      opacity: 0.6;
    }
    .trace-line-alt {
      stroke: #818cf8;
      stroke-width: 2;
      stroke-dasharray: 6 6;
      animation: dash 6s linear infinite reverse;
      opacity: 0.5;
    }

    .node-pulse {
      animation: pulse-node 3s ease-in-out infinite;
      transform-origin: center;
    }
    .animated-bg {
      animation: float 6s ease-in-out infinite;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-gradient)"/>
  <rect width="1196" height="356" x="2" y="2" rx="14" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Background Dynamic Network Nodes & Traces (Kept subtle and behind text) -->
  <g class="animated-bg">
    <!-- Trace Paths -->
    <path d="M 100 80 Q 300 30 550 90 T 1000 70" class="trace-line" fill="none"/>
    <path d="M 150 280 Q 450 330 750 270 T 1050 290" class="trace-line-alt" fill="none"/>
    <path d="M 80 180 C 250 120, 350 240, 600 180 C 850 120, 950 240, 1120 180" class="trace-line" fill="none"/>

    <!-- Decorative Nodes -->
    <circle cx="100" cy="80" r="5" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="550" cy="90" r="6" fill="#818cf8" filter="url(#glow)" class="node-pulse"/>
    <circle cx="1000" cy="70" r="5" fill="#38bdf8" filter="url(#glow)"/>

    <circle cx="150" cy="280" r="6" fill="#818cf8" filter="url(#glow)"/>
    <circle cx="600" cy="180" r="8" fill="#38bdf8" filter="url(#pulse-glow)" class="node-pulse"/>
    <circle cx="1050" cy="290" r="5" fill="#818cf8" filter="url(#glow)"/>
  </g>

  <!-- Content Container (Foreground - Centered & Highly Readable) -->
  <g transform="translate(600, 150)" text-anchor="middle">
    <!-- Top Pill Badge -->
    <rect x="-140" y="-85" width="280" height="32" rx="16" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
    <text x="0" y="-64" class="badge-text" text-anchor="middle">⚡ END-TO-END OBSERVABILITY</text>

    <!-- Main Title -->
    <text x="0" y="5" class="title" text-anchor="middle" filter="url(#glow)">Awesome Distributed Tracing</text>
    
    <!-- Subtitle -->
    <text x="0" y="48" class="subtitle" text-anchor="middle">OpenTelemetry • Jaeger • Zipkin • APM • Microservices Request Tracing</text>
  </g>

  <!-- Bottom Span Indicators -->
  <g transform="translate(300, 290)">
    <!-- Span Bar 1 -->
    <rect x="0" y="0" width="180" height="8" rx="4" fill="#38bdf8" opacity="0.8"/>
    <!-- Span Bar 2 -->
    <rect x="190" y="0" width="240" height="8" rx="4" fill="#818cf8" opacity="0.8"/>
    <!-- Span Bar 3 -->
    <rect x="440" y="0" width="160" height="8" rx="4" fill="#34d399" opacity="0.8"/>
  </g>
</svg>
